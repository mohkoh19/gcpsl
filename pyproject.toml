[project]
name = "gcpsl"
version = "0.1.0"
description = "Global Clustered Parallel Split Learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "Mohammad Kohankhaki" }]
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "hydra-core==1.3.2",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "pandas>=2.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["distributed: spawns several CPU processes"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
